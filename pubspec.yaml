name: fitness_diary
description: "Offline gym workout tracker."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^16.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  get_it: ^8.2.0
  intl: ^0.20.2
  gap: ^3.0.1
  shared_preferences: ^2.5.2
  crypto: ^3.0.6
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.1
  timezone: ^0.10.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  uuid: ^4.5.1

  path: ^1.9.1
  path_provider: ^2.1.5

dependency_overrides:
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/logo/