name: fitness_diary
description: "Offline gym workout tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^16.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.39

  path_provider: 2.1.5
  path: ^1.9.1

  get_it: ^8.2.0
  intl: ^0.20.2
  gap: ^3.0.1

dependency_overrides:
  path_provider_android: 2.2.15
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  drift_dev: ^2.28.1
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/